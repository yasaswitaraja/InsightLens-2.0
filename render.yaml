services:
  - type: web
    name: insightlens-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: FRONTEND_ORIGIN
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001

      - key: MAX_UPLOAD_MB
        value: "20"